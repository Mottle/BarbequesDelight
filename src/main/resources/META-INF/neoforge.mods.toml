modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.barbequesdelight]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.barbequesdelight]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.barbequesdelight]]
modId="farmersdelight"
type="required"
versionRange="[${farmers_delight_version}]"
ordering="AFTER"
side="BOTH"

[[dependencies.barbequesdelight]]
modId="jei"
type="optional"
versionRange="${jei_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.barbequesdelight]]
modId="jade"
type="optional"
versionRange="${jade_version_range}"
ordering="NONE"
side="CLIENT"
